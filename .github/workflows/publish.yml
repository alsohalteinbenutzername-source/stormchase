name: Publish StormChase data

on:
  schedule:
    # Offset by 2 minutes (:02, :07, :12, etc.) to avoid GitHub's :00/:05 queue drops
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r publisher/requirements.txt

      - name: Publish latest live data
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python publisher/publisher.py --skip-daily-outlook
