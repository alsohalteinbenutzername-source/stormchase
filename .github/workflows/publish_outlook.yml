name: Publish StormChase daily outlook

on:
  schedule:
    # 23:07 UTC = 00:07 CET (avoids top-of-hour traffic spikes)
    - cron: "7 23 * * *"
    # 22:07 UTC = 00:07 CEST (avoids top-of-hour traffic spikes)
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publisher/requirements.txt

      - name: Install publisher dependencies
        run: python -m pip install -r publisher/requirements.txt

      - name: Publish today's shared outlook
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python publisher/publisher.py --daily-outlook-only
